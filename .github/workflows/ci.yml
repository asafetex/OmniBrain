name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install 'ruff>=0.8.0'

      - name: Run ruff
        run: python -m ruff check tools/ tests/ bootstrap.py
        working-directory: omnibrain-triad

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install 'pytest>=9.0.0'

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/omnibrain-triad" >> "$GITHUB_ENV"

      - name: Run tests
        run: python -m pytest tests/ -v
        working-directory: omnibrain-triad

  test-sandbox:
    name: Test Sandbox
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: python -m pip install 'pytest>=9.0.0'

      - name: Run sandbox tests
        run: python -m pytest test_checkout.py -v
        working-directory: sandbox-l3-e2e
